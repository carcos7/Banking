services:
  # Transaction Service
  transaction-service:
    build:
      context: .
      dockerfile: TransactionService.Api/Dockerfile
    image: transaction-service:latest
    ports:
      - "5050:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80  # Disables HTTPS requirement
      - Kafka__BootstrapServers=kafka:9092
      - ConnectionStrings__TransactionDb=Host=transaction-db;Port=5432;Database=transactions;Username=postgres;Password=postgres$;
      
    depends_on:
      kafka:
        condition: service_healthy
      transaction-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - banking-network

  # Anti-Fraud Service
  anti-fraud-service:
    build:
      context: .
      dockerfile: AntiFraudService.Api/Dockerfile
    image: anti-fraud-service:latest
    ports:
      - "5051:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80  # Disables HTTPS requirement
      - Kafka__BootstrapServers=kafka:9092
      - ConnectionStrings__AntiFraudDb=Host=anti-fraud-db;Port=5432;Database=antifraud;Username=postgres;Password=postgres$;
    depends_on:
      kafka:
        condition: service_healthy
      anti-fraud-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - banking-network

  # Databases (Updated to PostgreSQL 15)
  transaction-db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres$
      POSTGRES_USER: postgres
      POSTGRES_DB: transactions
    ports:
      - "5434:5432"
    volumes:
      - transaction-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transactions"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - banking-network


  anti-fraud-db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres$
      POSTGRES_USER: postgres
      POSTGRES_DB: antifraud
    ports:
      - "5433:5432"
    volumes:
      - anti-fraud-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d antifraud"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - banking-network


  # Redis
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - banking-network


  # Kafka Cluster
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - banking-network


  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - banking-network


volumes:
  transaction-data:
  anti-fraud-data:

networks:
  banking-network:
    driver: bridge